[package]
name = "xia-yu-jia"
version = "0.1.0"
description = "厦与珈 Beamer 幻灯片工作台"
edition = "2021"
rust-version = "1.77"

[lib]
name = "xia_yu_jia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
trash = "5"
dirs = "6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
